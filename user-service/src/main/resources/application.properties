# 应用基础配置
server.port=8080
spring.application.name=user-service

# 开启spring虚拟线程支持
spring.threads.virtual.enabled=true

# H2数据库配置（开发环境）
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA配置
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# OpenAPI配置
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
springdoc.packages-to-scan=com.example.ecommerce
springdoc.default-consumes-media-type=application/json
springdoc.default-produces-media-type=application/json

# 开发工具配置
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

# HikariCP连接池配置（虚拟线程友好型）
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-test-query=SELECT 1

# Spring Actuator监控端点启用
management.endpoints.web.exposure.include=health,info,metrics,hikaricp
management.endpoint.metrics.access=read_only
management.endpoint.hikaricp.enabled=true